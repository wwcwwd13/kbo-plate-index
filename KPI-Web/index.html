<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b3516" />
    <title>KBO Plate Index · 구단별 Rating</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="title-lockup">
          <span class="project-mark" aria-hidden="true">KPI</span>
          <div>
            <h1>KBO Plate Index</h1>
            <p>2026 KBO 구단별 Rating</p>
          </div>
        </div>
        <div class="source-meta">
          <span id="last-updated">기준일 확인 중</span>
          <span class="source-divider" aria-hidden="true">·</span>
          <span>외부 공유용 표</span>
        </div>
      </header>

      <main class="page-content">
        <section class="sheet-card" aria-labelledby="sheet-title">
          <div class="sheet-card-header">
            <div>
              <p class="kicker">TEAM RATING</p>
              <h2 id="sheet-title">구단별 Rating</h2>
              <p class="sheet-description">참고 시트의 구단·선수 배열과 Rating 색상 기준을 웹 화면에 맞춰 재현했습니다.</p>
            </div>
            <div class="legend" aria-label="Rating 색상 기준">
              <span class="legend-item"><i class="legend-swatch band-high"></i>80 이상</span>
              <span class="legend-item"><i class="legend-swatch band-good"></i>65–79.9</span>
              <span class="legend-item"><i class="legend-swatch band-mid"></i>50–64.9</span>
              <span class="legend-item"><i class="legend-swatch band-low"></i>50 미만</span>
            </div>
          </div>

          <div id="rating-sections" class="rating-sections">
            <div class="loading-state">구단 Rating 데이터를 불러오는 중입니다.</div>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <span>KBO Plate Index</span>
        <a href="https://docs.google.com/spreadsheets/d/1RFlizhPk7cyzsh2J2WIKFtAaoumYJ61yz95cXxUMacg/edit?gid=387297493#gid=387297493" target="_blank" rel="noreferrer">참고 Google Sheet 열기</a>
      </footer>
    </div>
  </body>
</html>
